[project]
name = "yt-grab"
version = "0.1.0"
description = "Search or paste YouTube links, get tagged MP3s"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # unpinned on purpose, see Dockerfile
    "yt-dlp[default]",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
