<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}}</title>
<style>
  :root {
    --bg: #f6f6f4; --surface: #fff; --text: #1b1b1a; --muted: #6b6b66;
    --border: #e2e2dd; --accent: #d93b2b; --accent-text: #fff; --ok: #2f7d4a; --err: #b3261e;
    --bar: #ecece7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1e1e1c; --text: #ececea; --muted: #9a9a94;
      --border: #2e2e2b; --accent: #ef5a48; --accent-text: #fff; --ok: #5fbf80; --err: #f28b82;
      --bar: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 8px; }
  .who { color: var(--muted); font-size: 13px; text-align: right; }
  form.search { display: flex; gap: 8px; }
  input { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; min-width: 0; }
  form.search input { flex: 1; }
  button, a.btn { font: inherit; font-size: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 8px; padding: 8px 12px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  button.primary, a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button:disabled { opacity: .5; cursor: default; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px; }
  .row img { width: 96px; height: 54px; object-fit: cover; border-radius: 6px; flex: none; background: var(--bar); }
  .info { flex: 1; min-width: 0; }
  .title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .sub { color: var(--muted); font-size: 13px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .bar { height: 4px; background: var(--bar); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); transition: width .4s; }
  .done { color: var(--ok); } .error { color: var(--err); }
  .msg { margin: 12px 0 0; font-size: 14px; }
  .empty { color: var(--muted); font-size: 14px; }
  footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
  footer form { display: inline-flex; gap: 6px; margin-left: 6px; }
  footer input { padding: 6px 8px; width: 140px; }
  footer button { padding: 6px 10px; font-size: 13px; }
  @media (max-width: 520px) {
    .row { flex-wrap: wrap; }
    .row img { width: 80px; height: 45px; }
    .actions { width: 100%; justify-content: stretch; }
    .actions > * { flex: 1; text-align: center; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>{{APP_NAME}}</h1>
    <div class="who" id="who"></div>
  </header>

  <form class="search" id="search">
    <input id="q" type="text" placeholder="Search, or paste a YouTube link" autocomplete="off" autofocus>
    <button class="primary" type="submit">Go</button>
  </form>
  <p class="msg" id="msg" hidden></p>

  <section id="results-wrap" hidden>
    <h2>Results</h2>
    <div class="list" id="results"></div>
  </section>

  <section>
    <h2>Your queue</h2>
    <div class="list" id="jobs"><p class="empty">Nothing yet.</p></div>
  </section>

  <footer id="footer"></footer>
</main>

<script>
const $ = (s) => document.querySelector(s);
let me = null;
let pollTimer = null;

// builds DOM nodes, never innerHTML — titles are user-controlled
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined) n.append(k);
  return n;
}

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof body.detail === "string" ? body.detail : res.statusText);
  return body;
}

function flash(text, isError = true) {
  const m = $("#msg");
  m.textContent = text || "";
  m.className = "msg" + (isError ? " error" : "");
  m.hidden = !text;
}

function fmtDuration(s) {
  if (!s) return "";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${sec}` : `${m}:${sec}`;
}

async function loadMe() {
  me = await api("/api/me");
  const who = $("#who");
  who.replaceChildren(
    el("div", {}, me.user),
    me.admin ? el("div", {}, "admin") : el("div", {}, `${me.used_today}/${me.daily_limit} today`),
  );
  const footer = $("#footer");
  if (me.admin) {
    footer.replaceChildren(el("button", { onclick: logout }, "Log out of admin"));
  } else {
    const pw = el("input", { type: "password", placeholder: "admin password", autocomplete: "current-password" });
    footer.replaceChildren(
      "Admin?",
      el("form", { onsubmit: (e) => { e.preventDefault(); login(pw.value); } }, pw, el("button", { type: "submit" }, "Log in")),
    );
  }
}

async function login(password) {
  try {
    await api("/api/login", { method: "POST", body: JSON.stringify({ password }) });
    flash("");
    await loadMe();
    rerenderResults();
  } catch (e) { flash(e.message); }
}

async function logout() {
  await api("/api/logout", { method: "POST" });
  await loadMe();
  rerenderResults();
}

let lastResults = [];

function rerenderResults() { renderResults(lastResults); }

function renderResults(results) {
  lastResults = results;
  $("#results-wrap").hidden = !results.length;
  $("#results").replaceChildren(...results.map((r) => {
    const actions = [el("button", { class: me.admin ? "" : "primary", onclick: (e) => grab(r, "device", e.target) }, "Download")];
    if (me.admin && me.library) {
      actions.unshift(el("button", { class: "primary", onclick: (e) => grab(r, "library", e.target) }, "Add to Plex"));
    }
    return el("div", { class: "row" },
      el("img", { src: r.thumbnail, alt: "", loading: "lazy" }),
      el("div", { class: "info" },
        el("div", { class: "title" }, r.title),
        el("div", { class: "sub" }, [r.channel, fmtDuration(r.duration)].filter(Boolean).join(" · ")),
      ),
      el("div", { class: "actions" }, actions),
    );
  }));
}

async function grab(r, mode, btn) {
  btn.disabled = true;
  try {
    await api("/api/jobs", { method: "POST", body: JSON.stringify({ video_id: r.id, mode, title: r.title }) });
    btn.textContent = "Queued";
    flash("");
    await Promise.all([loadJobs(), loadMe()]);
  } catch (e) {
    btn.disabled = false;
    flash(e.message);
  }
}

const STATUS = { queued: "Queued", running: "Working…", done: "Done", error: "Failed", expired: "Expired" };

function renderJob(j) {
  const sub = [];
  if (j.artist) sub.push(j.artist);
  sub.push(j.mode === "library" ? "→ Plex" : "→ download");
  const status = el("span", { class: j.status === "done" ? "done" : j.status === "error" ? "error" : "" }, STATUS[j.status] || j.status);

  const info = el("div", { class: "info" },
    el("div", { class: "title" }, j.title || j.video_id),
    el("div", { class: "sub" }, sub.join(" · "), " · ", status),
  );
  if (j.status === "running" || j.status === "queued") {
    info.append(el("div", { class: "bar" }, el("div", { style: `width:${Math.round(j.progress * 100)}%` })));
  }
  if (j.error) info.append(el("div", { class: "sub error" }, j.error));

  const actions = el("div", { class: "actions" });
  if (j.has_file) actions.append(el("a", { class: "btn primary", href: `/api/jobs/${j.id}/file` }, "Save"));

  return el("div", { class: "row" },
    el("img", { src: `https://i.ytimg.com/vi/${encodeURIComponent(j.video_id)}/mqdefault.jpg`, alt: "", loading: "lazy" }),
    info, actions,
  );
}

async function loadJobs() {
  clearTimeout(pollTimer);
  try {
    const { jobs } = await api("/api/jobs");
    $("#jobs").replaceChildren(...(jobs.length ? jobs.map(renderJob) : [el("p", { class: "empty" }, "Nothing yet.")]));
    // only poll while something's moving
    if (jobs.some((j) => j.status === "queued" || j.status === "running")) {
      pollTimer = setTimeout(loadJobs, 1500);
    }
  } catch (e) {
    pollTimer = setTimeout(loadJobs, 5000);
  }
}

$("#search").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = $("#q").value.trim();
  if (!q) return;
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  flash("Searching…", false);
  try {
    const { results } = await api(`/api/search?q=${encodeURIComponent(q)}`);
    flash(results.length ? "" : "No results.", false);
    renderResults(results);
  } catch (err) {
    flash(err.message);
  } finally {
    btn.disabled = false;
  }
});

loadMe().then(loadJobs).catch((e) => flash(e.message));
</script>
</body>
</html>
